  apiVersion: "v1"
  kind: Pod
  metadata:
    name: evaluate-model
  spec:
        volumes:
          - name: shmem
            hostPath:
              path: /dev/shm
          - name: persistent-storage
            persistentVolumeClaim:
              claimName: fsx-claim
          - name: local
            hostPath:
              path: /dev
        nodeSelector:
          node.kubernetes.io/instance-type: "ml.g5.2xlarge"
        containers:
            - name: evaluation-container
              image: public.ecr.aws/o8u4p8i7/qwen-hpto:latest
              env:
                - name: LOGLEVEL
                  value: "DEBUG"
              command:
                  - "python"
                  - "/workspace/evaluate.py"
                  - "--model_path=/data/qwen3"
                  - "--eval_path=/workspace/eval"
                  - '--mlflow_tracking_server=arn:aws:sagemaker:us-west-2:535002850097:mlflow-tracking-server/SageMakerMLFlowTS'
                  - '--mlflow_exp_name=qwen-sft'
              volumeMounts:
                - name: shmem
                  mountPath: /dev/shm
                - name: persistent-storage
                  mountPath: /data
              resources:
                limits:
                  nvidia.com/gpu: 1
        
        restartPolicy: Never